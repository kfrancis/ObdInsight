name: Release

# Publishes the ObdInsight packages to NuGet.org via Trusted Publishing (OIDC) —
# no stored API keys. One-time setup lives in docs/RELEASING.md.
on:
  workflow_dispatch: # Allow running the workflow manually from the GitHub UI
  push:
    tags: ['v*']

env:
  DOTNET_MULTILEVEL_LOOKUP: 0
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_SYSTEM_CONSOLE_ALLOW_ANSI_COLOR_REDIRECTION: 1
  DOTNET_NOLOGO: true

permissions:
  contents: read
  id-token: write # required for NuGet Trusted Publishing

jobs:
  pack-and-publish:
    # Windows runner: test projects target net9.0-windows10.0.19041.0.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # MinVer derives the package version from git tags — needs full history.
          fetch-depth: 0

      - name: Setup .NET (from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # ObdInsight.Transports.Ble packs net9.0-android + net9.0-ios.
      - name: Install mobile workloads
        run: dotnet workload install android ios

      - name: Run unit tests
        run: dotnet run --project tests/ObdInsight.Tests -c Release

      - name: Run source generator tests
        run: dotnet run --project tests/ObdInsight.SourceGeneration.Tests -c Release

      - name: Pack
        shell: pwsh
        run: |
          $projects = @(
            'ObdInsight.Annotations',
            'ObdInsight.SourceGeneration',
            'ObdInsight.Core',
            'ObdInsight.Simulation',
            'ObdInsight.Telemetry',
            'ObdInsight.Transports.Ble'
          )
          foreach ($p in $projects) {
            # Version comes from MinVer (the pushed tag) — no explicit -p:Version.
            dotnet pack "src/$p" -c Release -o artifacts/packages `
              -p:ContinuousIntegrationBuild=true
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      # Exchanges the workflow's OIDC token for a short-lived NuGet API key.
      # Requires a Trusted Publishing policy on nuget.org (docs/RELEASING.md) and the
      # NUGET_USER repository variable (the nuget.org profile name the policy lives on).
      - name: NuGet login (trusted publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push packages
        shell: pwsh
        run: |
          # Enumerate explicitly: dotnet nuget push's own wildcard handling breaks on
          # Windows with forward-slash globs ("File does not exist"). Debug info is
          # embedded in each dll (DebugType=embedded) — no separate .snupkg to push.
          $packages = Get-ChildItem artifacts/packages -Filter *.nupkg
          if ($packages.Count -eq 0) { Write-Error 'No packages found to push.'; exit 1 }
          foreach ($pkg in $packages) {
            dotnet nuget push $pkg.FullName `
              --api-key ${{ steps.login.outputs.NUGET_API_KEY }} `
              --source https://api.nuget.org/v3/index.json `
              --skip-duplicate
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

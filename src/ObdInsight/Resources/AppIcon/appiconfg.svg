<?xml version="1.0" encoding="UTF-8"?>
<svg width="456" height="456" viewBox="0 0 456 456" xmlns="http://www.w3.org/2000/svg">
    <!-- OBD Connector Icon -->
    <g transform="translate(228, 180)">
        <!-- Main connector body -->
        <rect x="-65" y="-40" width="130" height="95" rx="10" fill="#FFFFFF"/>
        
        <!-- Connection pins (representing OBD-II 16-pin connector) -->
        <g>
            <!-- Top row of pins -->
            <rect x="-50" y="15" width="8" height="18" rx="2" fill="#512BD4"/>
            <rect x="-37" y="15" width="8" height="18" rx="2" fill="#512BD4"/>
            <rect x="-24" y="15" width="8" height="18" rx="2" fill="#512BD4"/>
            <rect x="-11" y="15" width="8" height="18" rx="2" fill="#512BD4"/>
            <rect x="2" y="15" width="8" height="18" rx="2" fill="#512BD4"/>
            <rect x="15" y="15" width="8" height="18" rx="2" fill="#512BD4"/>
            <rect x="28" y="15" width="8" height="18" rx="2" fill="#512BD4"/>
            <rect x="41" y="15" width="8" height="18" rx="2" fill="#512BD4"/>
            
            <!-- Bottom row of pins -->
            <rect x="-50" y="38" width="8" height="18" rx="2" fill="#512BD4"/>
            <rect x="-37" y="38" width="8" height="18" rx="2" fill="#512BD4"/>
            <rect x="-24" y="38" width="8" height="18" rx="2" fill="#512BD4"/>
            <rect x="-11" y="38" width="8" height="18" rx="2" fill="#512BD4"/>
            <rect x="2" y="38" width="8" height="18" rx="2" fill="#512BD4"/>
            <rect x="15" y="38" width="8" height="18" rx="2" fill="#512BD4"/>
            <rect x="28" y="38" width="8" height="18" rx="2" fill="#512BD4"/>
            <rect x="41" y="38" width="8" height="18" rx="2" fill="#512BD4"/>
        </g>
        
        <!-- Status LED indicators -->
        <circle cx="-35" cy="-15" r="7" fill="#00FF00"/>
        <circle cx="35" cy="-15" r="7" fill="#00BFFF"/>
    </g>
    
    <!-- Stylized "OI" monogram at the bottom -->
    <g transform="translate(228, 320)">
        <text x="0" y="0" font-family="Arial" font-size="72" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
            OI
        </text>
    </g>
</svg>
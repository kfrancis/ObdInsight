<?xml version="1.0" encoding="UTF-8"?>
<svg width="456" height="456" viewBox="0 0 456 456" xmlns="http://www.w3.org/2000/svg">
    <!-- Diagnostic connector icon -->
    <g transform="translate(228, 140)">
        <!-- OBD connector representation -->
        <rect x="-40" y="-20" width="80" height="60" rx="8" fill="#FFFFFF"/>
        
        <!-- Connection pins -->
        <rect x="-28" y="5" width="6" height="15" rx="1" fill="#512BD4"/>
        <rect x="-18" y="5" width="6" height="15" rx="1" fill="#512BD4"/>
        <rect x="-8" y="5" width="6" height="15" rx="1" fill="#512BD4"/>
        <rect x="2" y="5" width="6" height="15" rx="1" fill="#512BD4"/>
        <rect x="12" y="5" width="6" height="15" rx="1" fill="#512BD4"/>
        <rect x="22" y="5" width="6" height="15" rx="1" fill="#512BD4"/>
        
        <!-- Indicator light -->
        <circle cx="0" cy="-5" r="5" fill="#00FF00"/>
    </g>
    
    <!-- Signal waves -->
    <g transform="translate(228, 180)">
        <path d="M -60,-10 Q -60,0 -50,0" stroke="#FFFFFF" stroke-width="4" fill="none" stroke-linecap="round"/>
        <path d="M 60,-10 Q 60,0 50,0" stroke="#FFFFFF" stroke-width="4" fill="none" stroke-linecap="round"/>
    </g>
    
    <!-- App Name: ObdInsight -->
    <text x="228" y="270" font-family="Arial" font-size="52" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
        ObdInsight
    </text>
    
    <!-- Tagline -->
    <text x="228" y="305" font-family="Arial" font-size="20" fill="#FFFFFF" text-anchor="middle">
        Vehicle Diagnostics
    </text>
</svg>